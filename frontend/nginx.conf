server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API는 backend 컨테이너로 프록시 (동일 출처 — CORS 불필요)
    # Docker 내장 DNS(127.0.0.11)를 런타임에 사용. upstream을 변수로 두면 nginx가
    # 기동 시점에 한 번만 해석하지 않으므로, backend만 재배포돼 IP가 바뀌어도
    # 502로 고착되지 않고 자동으로 재해석된다.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 엑셀 업로드 대응 — 기본값 1M이면 큰 파일이 413으로 거부된다
        client_max_body_size 20M;
    }

    # SPA 라우팅 — 정적 파일이 없으면 index.html로 폴백
    # ($uri/ 미사용: /assets 같은 SPA 라우트가 디렉터리 리다이렉트와 충돌하지 않도록)
    location / {
        try_files $uri /index.html;
    }
}
